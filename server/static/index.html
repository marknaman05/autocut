<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autocut</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --line: #262c35;
    --text: #e6e9ee;
    --muted: #8b95a3;
    --accent: #ffd44a;
    --ok: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 24px; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }

  #drop {
    border: 2px dashed var(--line); border-radius: 14px; padding: 44px 24px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
    background: var(--panel);
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: #1c2129; }
  #drop strong { display: block; margin-bottom: 6px; }
  #drop span { color: var(--muted); font-size: 13px; }

  .options { display: flex; gap: 8px; align-items: center; margin-top: 16px; font-size: 13px; }
  .options label { color: var(--muted); }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px;
  }

  .card {
    margin-top: 20px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pct { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 13px; }
  .bar { height: 6px; background: #0c0f13; border-radius: 999px; overflow: hidden; margin: 14px 0 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
  .msg { color: var(--muted); font-size: 13px; }
  .msg.error { color: var(--bad); }

  ol.stages { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  ol.stages li {
    font-size: 11px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  ol.stages li.active { border-color: var(--accent); color: var(--accent); }
  ol.stages li.done { border-color: #2c4a35; color: var(--ok); }

  video { width: 100%; max-width: 300px; border-radius: 12px; margin-top: 18px; display: block; background: #000; }
  .summary { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .summary b { color: var(--text); font-weight: 600; }
  a.download, button.primary {
    display: inline-block; margin-top: 14px; background: var(--accent); color: #171b21;
    text-decoration: none; padding: 9px 16px; border-radius: 9px; font-weight: 600;
    font-size: 14px; border: 0; cursor: pointer; font-family: inherit;
  }
  button.primary:disabled { opacity: .5; cursor: default; }

  /* ---- review ---- */
  .review { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  .review video { max-width: 100%; margin: 0 0 16px; }
  .review-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .review-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .bulk { display: flex; gap: 6px; }
  .bulk button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 7px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .bulk button:hover { border-color: var(--accent); color: var(--accent); }

  ul.parts { list-style: none; margin: 0; padding: 0; counter-reset: part; }
  ul.parts li {
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px;
    align-items: start; padding: 10px 0; border-top: 1px solid var(--line);
  }
  /* A dropped part is still listed -- it can be put back -- but it is not
     part of the video, so it should not read like the rest. */
  ul.parts li.dropped { opacity: .45; }
  ul.parts li.dropped .cut-text q { text-decoration: line-through; }
  .order {
    counter-increment: part; font-variant-numeric: tabular-nums;
    color: var(--muted); font-size: 11px; min-width: 1.6em;
  }
  ul.parts li.dropped .order { visibility: hidden; }
  .order::before { content: counter(part); }
  .cut-toggle {
    appearance: none; width: 34px; height: 20px; border-radius: 999px;
    background: #2b323c; border: 0; cursor: pointer; position: relative;
    transition: background .15s; margin-top: 2px; flex: none;
  }
  .cut-toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s;
  }
  .cut-toggle[aria-pressed="true"] { background: #24402c; }
  .cut-toggle[aria-pressed="true"]::after { transform: translateX(14px); background: var(--ok); }

  .cut-body { min-width: 0; }
  .cut-meta {
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px;
  }
  .tag.retake, .tag.ngram_repeat { border-color: #6b4a1f; color: var(--accent); }
  .tag.filler { border-color: #3a4a6b; color: #93b4f8; }
  .tag.silence, .tag.offcut { border-color: var(--line); color: var(--muted); }
  .tag.untranscribed { border-color: #6b2a2a; color: var(--bad); }
  .cut-text { margin-top: 3px; font-size: 13px; }
  .cut-text q { color: var(--text); }
  /* A caption word is editable in place: the recogniser mishears names and
     jargon constantly, and the fix is one word long. */
  .w {
    border-radius: 3px; padding: 0 2px; margin: 0 -1px;
    border-bottom: 1px dashed transparent; cursor: text; white-space: pre;
  }
  .w:hover { border-bottom-color: var(--line); }
  /* The recogniser said so itself: these are the words to read twice. */
  .w.uncertain { border-bottom: 1px dashed var(--accent); color: var(--accent); }
  .w.uncertain:focus { color: var(--text); }
  .w:focus { outline: none; background: #2b323c; border-bottom-color: var(--accent); }
  .w.saving { opacity: .5; }
  .w.saved { background: #24402c; transition: background 1.2s ease; }
  .w.failed { background: #4a2020; }
  .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
  .hint .flag { color: var(--accent); font-weight: 400; border-bottom: 1px dashed var(--accent); }
  .cut-text .ctx { color: var(--muted); }
  .cut-text .none { color: var(--muted); font-style: italic; }
  .play {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 7px; padding: 3px 9px; font: inherit; font-size: 12px;
    cursor: pointer; flex: none;
  }
  .play:hover { border-color: var(--accent); color: var(--accent); }
  .totals { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .totals b { color: var(--text); }

  /* ---- publish ---- */
  .publish { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  .publish h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  .publish h2 .hint { margin-left: 6px; }
  .publish textarea {
    width: 100%; min-height: 64px; resize: vertical; background: var(--bg);
    color: var(--text); border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 10px; font: inherit; font-size: 13px;
  }
  .publish textarea:focus { outline: none; border-color: var(--accent); }
  .publish .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .publish .actions .msg { margin-top: 14px; }
  .publish a.posted { color: var(--ok); font-weight: 600; }
  .publish .setup { color: var(--muted); font-size: 13px; }
  .publish .setup code { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>autocut</h1>
  <p class="sub">Raw take in, vertical cut with captions out. You choose the cuts.</p>

  <div id="drop">
    <strong>Drop a video here</strong>
    <span>or click to choose &middot; mp4, mov, m4v</span>
  </div>
  <input id="file" type="file" accept="video/*" hidden>

  <div class="options">
    <label for="preset">Edit</label>
    <select id="preset">
      <option value="default">Default</option>
      <option value="gentle">Gentle &mdash; pauses only</option>
      <option value="aggressive">Aggressive &mdash; tight</option>
    </select>
  </div>

  <div id="jobs"></div>
</main>

<script>
const STAGES = ["ingest", "transcribe", "analyze", "preview", "review", "cut", "track", "captions", "compose"];
const LABELS = {
  ingest: "read", transcribe: "transcribe", analyze: "find cuts", preview: "preview",
  review: "review", cut: "cut", track: "frame", captions: "caption", compose: "render",
};
const REASONS = {
  silence: "pause", filler: "filler", retake: "retake", ngram_repeat: "retake",
  offcut: "offcut", untranscribed: "check this",
};
//: A span shorter than this is not worth seeking to.
const MIN_PREVIEW = 0.05;

const drop = document.getElementById("drop");
const input = document.getElementById("file");
const jobsEl = document.getElementById("jobs");

drop.addEventListener("click", () => input.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files.length) upload(e.dataTransfer.files[0]);
});
input.addEventListener("change", () => {
  if (input.files.length) upload(input.files[0]);
  input.value = "";
});

async function upload(file) {
  const body = new FormData();
  body.append("file", file);
  body.append("preset", document.getElementById("preset").value);

  const card = addCard(file.name);
  try {
    const response = await fetch("/jobs", { method: "POST", body });
    if (!response.ok) throw new Error(await response.text());
    const job = await response.json();
    card.dataset.id = job.id;
    render(card, job);
    listen(card, job.id);
  } catch (error) {
    render(card, { status: "error", message: "upload failed", error: String(error), percent: 0 });
  }
}

function addCard(filename) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="row"><span class="name"></span><span class="pct"></span></div>
    <div class="bar"><i></i></div>
    <div class="msg"></div>
    <ol class="stages">${STAGES.map(s => `<li data-stage="${s}">${LABELS[s]}</li>`).join("")}</ol>
    <div class="review" hidden></div>
    <div class="output"></div>`;
  card.querySelector(".name").textContent = filename;
  jobsEl.prepend(card);
  return card;
}

const time = seconds => {
  const m = Math.floor(seconds / 60);
  const s = (seconds % 60).toFixed(1).padStart(4, "0");
  return `${m}:${s}`;
};

// The server pushes the whole job snapshot on every change, so rendering is a
// pure function of the latest one -- no incremental state to get out of sync.
function render(card, job) {
  const done = job.status === "done";
  card.querySelector(".pct").textContent =
    done ? "done" : job.status === "review" ? "your turn" : `${job.percent || 0}%`;
  card.querySelector(".bar > i").style.width = `${done ? 100 : (job.percent || 0)}%`;

  const msg = card.querySelector(".msg");
  msg.textContent = job.error ? `${job.message}: ${job.error}` : (job.message || "");
  msg.classList.toggle("error", job.status === "error");

  const reached = STAGES.indexOf(job.status === "review" ? "review" : job.stage);
  card.querySelectorAll(".stages li").forEach((li, index) => {
    li.classList.toggle("done", done || (reached > -1 && index < reached));
    li.classList.toggle("active", !done && index === reached);
  });

  // Cuts are fetched once, when the job first reaches review; re-rendering
  // from a later snapshot must not wipe out choices already made.
  if (job.status === "review" && !card.dataset.reviewing) {
    card.dataset.reviewing = "1";
    showReview(card, job);
  }
  if (job.status === "rendering" || done) {
    const review = card.querySelector(".review");
    review.querySelectorAll("button").forEach(b => { b.disabled = true; });
  }

  if (done && job.summary && !card.querySelector(".output video")) {
    const s = job.summary;
    card.querySelector(".review").hidden = true;
    card.querySelector(".output").innerHTML = `
      <video controls preload="metadata" src="/jobs/${card.dataset.id}/result"></video>
      <div class="summary">
        <b>${s.source_duration}s</b> &rarr; <b>${s.output_duration}s</b>
        (${s.removed_percent}% removed) &middot; ${s.segments} segments &middot;
        ${s.words} words &middot; ${s.tracked ? "face tracked" : "centre crop"} &middot;
        rendered in ${s.elapsed}s
      </div>
      <a class="download" href="/jobs/${card.dataset.id}/result" download>Download</a>
      <div class="publish"></div>`;
    showPublish(card);
  }
  if (done && job.publish) renderPublish(card, job.publish);
}

// ---- Instagram ---------------------------------------------------------

// Looked up once per page: whether a token is set and whom it belongs to.
// The finished card either offers to publish as that account, or says what
// is missing.  Checked lazily so a page with nothing finished never asks.
let instagramStatus = null;
function instagram() {
  if (!instagramStatus) instagramStatus = fetch("/instagram").then(r => r.json());
  return instagramStatus;
}

async function showPublish(card) {
  const panel = card.querySelector(".publish");
  const status = await instagram();
  if (!status.connected) {
    panel.innerHTML = `
      <h2>Instagram</h2>
      <div class="setup">Not connected: ${escape(status.error)}.
        Put <code>UPLOAD_POST_API_KEY</code> or <code>INSTAGRAM_ACCESS_TOKEN</code> in <code>.env</code> and restart &mdash; the README says how.</div>`;
    return;
  }
  panel.innerHTML = `
    <h2>Post to Instagram <span class="hint">as @${escape(status.username)}${status.via === "upload-post" ? " via Upload-Post" : ""}</span></h2>
    <textarea placeholder="Caption (optional)" maxlength="2200"></textarea>
    <div class="actions">
      <button class="primary">Publish as a Reel</button>
      <span class="msg"></span>
    </div>`;
  const button = panel.querySelector("button");
  button.addEventListener("click", () => publish(card));
  // The snapshot may already carry a publish from before a reload.
  if (card.dataset.publish) renderPublish(card, JSON.parse(card.dataset.publish));
}

async function publish(card) {
  const id = card.dataset.id;
  const panel = card.querySelector(".publish");
  const caption = panel.querySelector("textarea").value;
  panel.querySelector("button").disabled = true;
  try {
    const response = await fetch(`/jobs/${id}/publish`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ caption }),
    });
    if (!response.ok) throw new Error(await response.text());
    renderPublish(card, await response.json());
  } catch (error) {
    renderPublish(card, { status: "error", message: "failed", error: String(error) });
  }
}

// Publishing is network-bound and lives outside the render worker, so its
// progress is polled rather than pushed: the job's event stream has already
// closed by the time there is anything to publish.
function renderPublish(card, publication) {
  const panel = card.querySelector(".publish");
  if (!panel.querySelector("button")) {
    // The panel is not built yet (the account lookup is still in flight);
    // stash the state and let showPublish pick it up.
    card.dataset.publish = JSON.stringify(publication);
    return;
  }
  const button = panel.querySelector("button");
  const msg = panel.querySelector(".msg");
  const textarea = panel.querySelector("textarea");
  msg.classList.toggle("error", publication.status === "error");

  if (publication.status === "published") {
    button.hidden = true;
    textarea.disabled = true;
    msg.innerHTML = publication.permalink
      ? `<a class="posted" href="${escape(publication.permalink)}" target="_blank" rel="noopener">Posted &mdash; open on Instagram &rarr;</a>`
      : `<span class="posted">Posted</span>`;
    return;
  }
  if (publication.status === "error") {
    button.disabled = false;
    msg.textContent = `${publication.message}: ${publication.error}`;
    return;
  }
  button.disabled = true;
  msg.textContent = `${publication.message}…`;
  if (!card.dataset.polling) {
    card.dataset.polling = "1";
    const tick = async () => {
      try {
        const response = await fetch(`/jobs/${card.dataset.id}/publish`);
        const latest = await response.json();
        if (latest.status === "publishing") { setTimeout(tick, 2000); return; }
        delete card.dataset.polling;
        renderPublish(card, latest);
      } catch (error) {
        delete card.dataset.polling;
        renderPublish(card, { status: "error", message: "lost contact", error: String(error) });
      }
    };
    setTimeout(tick, 2000);
  }
}

async function showReview(card, job) {
  const id = card.dataset.id;
  const panel = card.querySelector(".review");
  panel.hidden = false;
  panel.innerHTML = `<div class="msg">loading&hellip;</div>`;

  let data;
  try {
    const response = await fetch(`/jobs/${id}/parts`);
    if (!response.ok) throw new Error(await response.text());
    data = await response.json();
  } catch (error) {
    panel.innerHTML = `<div class="msg error">could not load parts: ${error}</div>`;
    return;
  }

  panel.innerHTML = `
    <video controls preload="metadata" src="/jobs/${id}/preview"></video>
    <div class="review-head">
      <h2>Parts of the final video
        <span class="hint">&middot; click a word to fix it; <b class="flag">marked</b> ones the recogniser doubted</span>
      </h2>
      <div class="bulk">
        <button data-play="1">&#9654; play the edit</button>
        <button data-all="1">keep all</button>
        <button data-all="0">keep none</button>
      </div>
    </div>
    <ul class="parts"></ul>
    <div class="totals"></div>
    <button class="primary">Render</button>`;

  const video = panel.querySelector("video");
  const list = panel.querySelector("ul.parts");

  for (const part of data.parts) {
    const li = document.createElement("li");
    li.dataset.id = part.id;
    li.dataset.duration = part.duration;
    li.dataset.start = part.start;
    li.dataset.end = part.end;

    // A part the detectors left alone is just video; one they proposed
    // dropping is labelled with why, so the reason is there when deciding
    // whether to put it back.
    const tag = part.reason
      ? `<span class="tag ${part.reason}">${REASONS[part.reason] || part.reason}</span>`
      : "";
    // Every word is its own editable element, keyed by where it sits in the
    // transcript.  Editing the part's text as one string was the obvious
    // alternative and cannot work: the caption highlights one word at a time
    // off per-word timings, so text and timing have to stay in step, and
    // nothing can say which of a retyped sentence's words is which.
    const body = part.caption && part.caption.length
      ? part.caption
          .map(w => `<span class="w${w.uncertain ? " uncertain" : ""}"` +
                    ` contenteditable="true" spellcheck="false"` +
                    (w.uncertain ? ` title="the recogniser was unsure of this word"` : "") +
                    ` data-index="${w.index}">${escape(w.text)}</span>`)
          .join(" ")
      : `<span class="none">${escape(part.detail || "no speech")}</span>`;

    li.innerHTML = `
      <button class="cut-toggle" aria-pressed="${part.keep}" title="keep or drop"></button>
      <div class="cut-body">
        <div class="cut-meta">
          <span class="order"></span>
          <span>${time(part.start)} &ndash; ${time(part.end)}</span>
          <span>${part.duration.toFixed(1)}s</span>
          ${tag}
        </div>
        <div class="cut-text">${body}</div>
      </div>
      <button class="play">&#9654; hear</button>`;
    li.classList.toggle("dropped", !part.keep);

    li.querySelector(".cut-toggle").addEventListener("click", event => {
      const button = event.currentTarget;
      const next = button.getAttribute("aria-pressed") !== "true";
      button.setAttribute("aria-pressed", String(next));
      li.classList.toggle("dropped", !next);
      updateTotals(panel, data.duration);
    });
    // Hearing a part plays exactly that part and stops -- it is one piece of
    // the final video, so that is the whole of what there is to judge.
    li.querySelector(".play").addEventListener("click", () => {
      playSpans(video, [[part.start, part.end]]);
    });
    li.querySelectorAll(".w").forEach(word => bindWord(word, id, card));
    list.appendChild(li);
  }

  panel.querySelectorAll(".bulk button[data-all]").forEach(button => {
    button.addEventListener("click", () => {
      const on = button.dataset.all === "1";
      list.querySelectorAll("li").forEach(li => {
        li.querySelector(".cut-toggle").setAttribute("aria-pressed", String(on));
        li.classList.toggle("dropped", !on);
      });
      updateTotals(panel, data.duration);
    });
  });

  // Play every kept part back to back, skipping the rest: the edit as it will
  // be, before spending a render on finding out.
  panel.querySelector(".bulk button[data-play]").addEventListener("click", () => {
    playSpans(video, keptParts(panel).map(li => [Number(li.dataset.start), Number(li.dataset.end)]));
  });

  panel.querySelector("button.primary").addEventListener("click", async event => {
    const button = event.currentTarget;
    const keep = keptParts(panel).map(li => Number(li.dataset.id));
    if (!keep.length) {
      card.querySelector(".msg").textContent = "keep at least one part";
      card.querySelector(".msg").classList.add("error");
      return;
    }
    button.disabled = true;
    button.textContent = "Rendering…";
    const response = await fetch(`/jobs/${id}/render`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ keep }),
    });
    if (!response.ok) {
      button.disabled = false;
      button.textContent = "Render";
      card.querySelector(".msg").textContent = `could not start render: ${await response.text()}`;
      card.querySelector(".msg").classList.add("error");
    }
  });

  updateTotals(panel, data.duration);
}

// One word, editable in place.  A correction is saved the moment focus leaves
// it, so there is no save button to forget and no draft state to lose -- and
// the word redraws from what the server stored, not from what was typed.
function bindWord(word, id, card) {
  word.dataset.original = word.textContent;

  // Enter commits rather than opening a second line: this is one word, and a
  // contenteditable left to itself would take a newline literally.
  word.addEventListener("keydown", event => {
    if (event.key === "Enter") { event.preventDefault(); word.blur(); }
    if (event.key === "Escape") {
      event.preventDefault();
      word.textContent = word.dataset.original;
      word.blur();
    }
  });
  // Paste arrives as whatever was copied, markup included; only the text of it
  // belongs in a caption.
  word.addEventListener("paste", event => {
    event.preventDefault();
    const text = (event.clipboardData || window.clipboardData).getData("text");
    document.execCommand("insertText", false, text.replace(/\s+/g, " ").trim());
  });

  word.addEventListener("blur", async () => {
    const text = word.textContent.trim();
    if (text === word.dataset.original) { word.textContent = text; return; }
    if (!text) {
      // Blank is the one edit that cannot be honoured -- the word still has a
      // slot on the timeline, and the caption has to put something in it.
      word.textContent = word.dataset.original;
      return;
    }

    word.classList.add("saving");
    try {
      const response = await fetch(`/jobs/${id}/captions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ edits: [{ index: Number(word.dataset.index), text }] }),
      });
      if (!response.ok) throw new Error(await response.text());
      const data = await response.json();
      // Redraw from what was actually stored, so a server-side normalisation
      // is visible rather than silently disagreeing with the screen.
      const stored = data.parts
        .flatMap(part => part.caption || [])
        .find(w => String(w.index) === word.dataset.index);
      word.textContent = stored ? stored.text : text;
      word.dataset.original = word.textContent;
      // A word that has been read and corrected is no longer one to check,
      // whatever the recogniser thought of its own guess.
      word.classList.remove("uncertain");
      word.removeAttribute("title");
      word.classList.add("saved");
      setTimeout(() => word.classList.remove("saved"), 1200);
    } catch (error) {
      word.textContent = word.dataset.original;
      word.classList.add("failed");
      setTimeout(() => word.classList.remove("failed"), 2000);
      const msg = card.querySelector(".msg");
      msg.textContent = `could not save that word: ${error}`;
      msg.classList.add("error");
    } finally {
      word.classList.remove("saving");
    }
  });
}

const keptParts = panel =>
  [...panel.querySelectorAll("ul.parts li")].filter(
    li => li.querySelector(".cut-toggle").getAttribute("aria-pressed") === "true"
  );

function updateTotals(panel, duration) {
  const items = [...panel.querySelectorAll("ul.parts li")];
  const kept = keptParts(panel);
  const output = kept.reduce((total, li) => total + Number(li.dataset.duration), 0);
  const removed = duration - output;
  panel.querySelector(".totals").innerHTML =
    `final video: <b>${output.toFixed(1)}s</b> from <b>${kept.length}</b> of ${items.length} parts ` +
    `&middot; ${removed.toFixed(1)}s dropped (${Math.round((removed / duration) * 100)}%)`;
}

// Play a list of spans back to back, seeking across the gaps between them and
// stopping at the end of the last -- so hearing one cut never runs on into the
// next.
function playSpans(video, spans) {
  const clean = spans
    .map(([from, to]) => [Math.max(from, 0), Math.max(to, 0)])
    .filter(([from, to]) => to - from > MIN_PREVIEW);
  if (!clean.length) return;

  bindPlayback(video);
  const plan = { spans: clean, index: 0, expecting: clean[0][0] };
  video.playback = plan;
  video.currentTime = plan.expecting;
  video.play();
}

function bindPlayback(video) {
  if (video.dataset.bound) return;
  video.dataset.bound = "1";

  video.addEventListener("timeupdate", () => {
    const plan = video.playback;
    if (!plan) return;
    if (video.currentTime < plan.spans[plan.index][1]) return;

    plan.index += 1;
    if (plan.index >= plan.spans.length) {
      video.pause();
      video.playback = null;
      return;
    }
    plan.expecting = plan.spans[plan.index][0];
    video.currentTime = plan.expecting;
  });

  // Distinguish our own seeks from the viewer scrubbing the timeline: only a
  // seek we did not ask for means they have taken over, and steering playback
  // out from under them at that point is precisely the bug this replaced.
  video.addEventListener("seeked", () => {
    const plan = video.playback;
    if (plan && Math.abs(video.currentTime - plan.expecting) > 0.3) {
      video.playback = null;
    }
  });
}

const escape = text =>
  String(text ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function listen(card, id) {
  const source = new EventSource(`/jobs/${id}/events`);
  source.onmessage = event => {
    const job = JSON.parse(event.data);
    render(card, job);
    if (job.status === "done" || job.status === "error") source.close();
  };
  source.onerror = () => source.close();
}

// Pick up anything already running, so a reload does not lose a job.
fetch("/jobs").then(r => r.json()).then(jobs => {
  for (const job of jobs.reverse()) {
    const card = addCard(job.filename);
    card.dataset.id = job.id;
    render(card, job);
    if (job.status !== "done" && job.status !== "error") listen(card, job.id);
  }
});
</script>
